[project]
name = "python-automation-toolkit"
version = "0.1.0"
description = "Infrastructure Automation Toolkit for ATM and Network Logs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
clean = "logger_cleaner:main"
archive = "log_architect:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"